:root{--paper:#F3F1EC;--ink:#0B0B0C;--org:#FF5B14;--red:#E11D2E;--grn:#12925E;--mute:#6B6A66;--line:#DCD8D0}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#0B0B0C;transition:background .8s;font-family:Jakarta,system-ui,sans-serif;font-weight:500;letter-spacing:-.015em;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:var(--paper);color:var(--ink);will-change:transform}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 119px,rgba(11,11,12,.045) 119px 120px)}
.slide.dark{background:var(--ink);color:var(--paper)}.slide.dark::before{background:repeating-linear-gradient(90deg,transparent 0 119px,rgba(243,241,236,.04) 119px 120px)}
.abs{position:absolute}.cv{position:absolute;left:0;top:0;width:1920px;height:1080px}
em{font-family:Rozha,serif;font-style:normal;font-weight:400;letter-spacing:-.01em;color:var(--org)}
.ln{display:block;overflow:hidden;padding:.06em 0 .16em;margin:-.06em 0 -.16em}.li{display:inline-block;transform-origin:0 100%;white-space:nowrap}
.kick{left:120px;top:136px;display:flex;gap:16px;align-items:baseline;font-size:18px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}.kick b{font:600 18px Mono;color:var(--org);letter-spacing:0}.dark .kick{color:#8F8D88}
.hd{left:120px;top:176px;font-size:104px;font-weight:800;letter-spacing:-.052em;line-height:1;width:1700px}.hd.sm{font-size:96px}.hd.s6{font-size:80px;width:760px}.hd.xl{font-size:116px;width:1000px}
.org{color:var(--org)!important}.red{color:var(--red)!important}
/* chrome */
#brand,#pg,#nav{position:absolute;z-index:20;mix-blend-mode:difference;color:#fff}#brand{left:120px;top:56px;font-size:24px;font-weight:800;letter-spacing:-.04em}#pg{right:120px;top:60px;font:500 17px Mono;letter-spacing:.06em;opacity:.7}#pg b{font-weight:700}
#nav{left:50%;bottom:26px;translate:-50% 0;display:flex;gap:6px}#nav button{width:46px;height:24px;display:flex;align-items:center}#nav i{display:block;width:100%;height:3px;background:#fff;opacity:.25;transition:opacity .4s,height .3s;border-radius:2px}#nav button.on i{opacity:.95}#nav button:hover i{height:5px;opacity:.8}

.shade{inset:0;background:linear-gradient(90deg,rgba(11,11,12,.97) 0%,rgba(11,11,12,.9) 34%,rgba(11,11,12,0) 64%),linear-gradient(0deg,rgba(11,11,12,.9) 0%,rgba(11,11,12,0) 30%)}
